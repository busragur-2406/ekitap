
<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Kitap Düzenle</title>
</head>

<body>

    <div class="icerik">

        <h1>Kitap Düzenle</h1>

        <form th:action="@{/admin/kitap/duzenle/{id}(id=${kitap.id})}"
              th:object="${kitap}"
              method="post">

            <label>Kitap Başlığı</label>
            <input type="text" th:field="*{baslik}" required>

            <label>Yazar</label>
            <input type="text" th:field="*{yazar}" required>

            <label>ISBN</label>
            <input type="text" th:field="*{isbn}">

            <label>Baskı Yılı</label>
            <input type="number" th:field="*{baskiYili}">

            <label>Sayfa Sayısı</label>
            <input type="number" min="1" th:field="*{sayfaSayisi}">

            <label>Fiyat</label>
            <input type="number" step="0.01" min="0"
                   th:field="*{fiyat}" required>

            <label>Stok</label>
            <input type="number" min="0"
                   th:field="*{stok}" required>

            <label>Kategori</label>
            <select th:field="*{kategori.id}" required>
                <option value="">Kategori Seçiniz</option>
                <option th:each="kat : ${kategoriler}"
                        th:value="${kat.id}"
                        th:text="${kat.ad}">
                </option>
            </select>

            <button type="submit">Güncelle</button>

        </form>

        <p>
            <a th:href="@{/admin/kitap/ekle}">
                ← Kitap Yönetimine Dön
            </a>
        </p>

    </div>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .icerik {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>

</body>
</html>
