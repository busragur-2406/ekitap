
<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>eKitap - Kitap Yönetimi</title>
</head>

<body>

    <div class="icerik">

        <h1>Kitap Yönetimi</h1>

        <h2>Mevcut Kitaplar</h2>

        <div class="tablo-alani">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Başlık</th>
                        <th>Yazar</th>
                        <th>ISBN</th>
                        <th>Fiyat</th>
                        <th>Stok</th>
                        <th>Kategori</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="k : ${kitaplar}">
                        <td th:text="${k.id}"></td>
                        <td th:text="${k.baslik}"></td>
                        <td th:text="${k.yazar}"></td>
                        <td th:text="${k.isbn}"></td>
                        <td th:text="${k.fiyat}"></td>
                        <td th:text="${k.stok}"></td>
                        <td th:text="${k.kategori != null ? k.kategori.ad : '-'}"></td>

                        <td>
                            <a class="btn mavi"
                               th:href="@{/admin/kitap/duzenle/{id}(id=${k.id})}">
                                Düzenle
                            </a>

                            <form th:action="@{/admin/kitap/sil/{id}(id=${k.id})}"
                                  method="post"
                                  style="display:inline;">

                                <button class="btn kirmizi"
                                        type="submit"
                                        onclick="return confirm('Kitap silinsin mi?')">
                                    Sil
                                </button>

                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(kitaplar)}">
                        <td colspan="8">Henüz kitap eklenmedi.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-alani">

            <h2>Yeni Kitap Ekle</h2>

            <form th:action="@{/admin/kitap/ekle}"
                  th:object="${kitap}"
                  method="post">

                <label>Kitap Başlığı</label>
                <input type="text" th:field="*{baslik}" required>

                <label>Yazar</label>
                <input type="text" th:field="*{yazar}" required>

                <label>ISBN</label>
                <input type="text" th:field="*{isbn}">

                <label>Baskı Yılı</label>
                <input type="number" th:field="*{baskiYili}">

                <label>Sayfa Sayısı</label>
                <input type="number" min="1"
                       th:field="*{sayfaSayisi}">

                <label>Fiyat</label>
                <input type="number" step="0.01" min="0"
                       th:field="*{fiyat}" required>

                <label>Stok</label>
                <input type="number" min="0"
                       th:field="*{stok}" required>

                <label>Kategori</label>
                <select th:field="*{kategori.id}" required>
                    <option value="">Kategori Seçiniz</option>
                    <option th:each="kat : ${kategoriler}"
                            th:value="${kat.id}"
                            th:text="${kat.ad}">
                    </option>
                </select>

                <button class="btn yesil" type="submit">
                    Kitabı Kaydet
                </button>

            </form>
        </div>

        <p>
            <a th:href="@{/admin}">← Yönetim Paneline Dön</a>
        </p>

    </div>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        .icerik {
            max-width: 1150px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #243447;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        input, select {
            padding: 10px;
            margin: 5px 0 15px;
            width: 100%;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 9px 14px;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .mavi {
            background: #2563eb;
        }

        .kirmizi {
            background: #dc2626;
        }

        .yesil {
            background: #16a34a;
        }

        .form-alani {
            background: #f4f6f9;
            padding: 20px;
            border-radius: 10px;
        }

        .tablo-alani {
            overflow-x: auto;
        }
    </style>

</body>
</html>
